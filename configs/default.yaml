camera:
  index: 0
  width: 1280
  height: 720
  fps: 30
  mirror: true

recognition:
  fsm:
    enabled: true
  models:
    static_pose:
      enabled: false
      pose:
        enabled: true
      finger_count:
        enabled: true
      finger_pointing:
        enabled: true
      flat_hand:
        enabled: true
    motion:
      enabled: false

gestures:
  pinch_drag:
    enabled: true
    distance_threshold: 0.12
    release_threshold: 0.16
    hold_ms: 120
    drag_pinch_threshold: 0.12
    drag_release_threshold: 0.16
    drag_activation_hold_ms: 150
    drag_min_move: 0.002
    pinch_tap_distance_threshold: 0.12
    pinch_tap_release_threshold: 0.16
    pinch_tap_min_duration_ms: 20
    pinch_tap_max_duration_ms: 180
  swipe_motion:
    enabled: true
    min_velocity: 0.65
    min_distance: 0.12
    diagonal_swipe_min_distance: 0.16
    diagonal_swipe_axis_balance_ratio: 2.25
    max_duration_ms: 500
    cooldown_ms: 300
    direction_ratio: 1.35
  zoom:
    enabled: true
    min_reference_distance: 0.04
    min_delta: 0.08
    min_duration_ms: 120
    max_duration_ms: 700
    cooldown_ms: 250
  pose:
    enabled: true
    min_hold_ms: 80
    cooldown_ms: 250
    pinch_distance_threshold: 0.12
    ok_distance_threshold: 0.14
    spread_distance_threshold: 0.45
    direction_ratio: 1.25
    l_shape_min_angle_degrees: 55.0
    l_shape_max_angle_degrees: 125.0
  finger_count:
    enabled: true
    min_hold_ms: 80
    cooldown_ms: 250
  finger_pointing:
    enabled: true
    min_hold_ms: 80
    cooldown_ms: 250
    direction_ratio: 1.25
    min_vector_length: 0.05
  flat_hand:
    enabled: true
    min_hold_ms: 80
    cooldown_ms: 250
    direction_ratio: 1.25
  flick:
    enabled: true
    history_size: 16
    max_history_ms: 1500
    cooldown_ms: 250
    direction_ratio: 1.35
    min_velocity: 1.2
    min_distance: 0.04
    max_duration_ms: 180
  motion:
    enabled: true
    history_size: 32
    max_history_ms: 1500
    cooldown_ms: 250
    direction_ratio: 1.35
    wave_min_amplitude: 0.08
    wave_min_direction_changes: 3
    wave_max_duration_ms: 1200
    push_pull_min_scale_delta: 0.18
    push_pull_max_duration_ms: 900
    throw_min_distance: 0.12
    throw_min_velocity: 0.8
    throw_max_duration_ms: 900
  rotation:
    enabled: true
    history_size: 32
    max_history_ms: 1500
    cooldown_ms: 250
    circle_min_radius: 0.05
    circle_min_arc_degrees: 300.0
    circle_max_duration_ms: 1400
    circle_closure_ratio: 1.5
    rotate_min_degrees: 70.0
    rotate_max_duration_ms: 1000
  scroll:
    enabled: true
    history_size: 32
    max_history_ms: 1500
    cooldown_ms: 250
    direction_ratio: 1.35
    min_distance: 0.08
    max_duration_ms: 900
  air_draw:
    enabled: true
    min_distance: 0.01
  two_hand:
    enabled: true
    cooldown_ms: 300
    zoom_min_delta: 0.10
    rotate_min_degrees: 35.0
    pan_min_distance: 0.10
    clap_distance_threshold: 0.14
    clap_min_closing_delta: 0.08
    frame_min_width: 0.30

broker:
  websocket:
    enabled: false
    host: "127.0.0.1"
    port: 8765
    require_jwt: true
    jwt_env_file: ".env"
    jwt_auth_timeout_seconds: 5.0
  osc:
    enabled: false
    host: "127.0.0.1"
    port: 9000

gesture_events:
  PINCH_START: true
  PINCH_HOLD: true
  PINCH_END: true
  DRAG_START: true
  DRAG_MOVE: true
  DRAG_END: true
  SWIPE_LEFT: true
